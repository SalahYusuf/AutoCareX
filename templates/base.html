{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link
        rel="icon"
        href="{% static 'image/autocarexlogoblack.png' %}"
    >
    <link
        rel="stylesheet"
        href="{% static 'css/navbar.css' %}"
    >

    <title>
        {% block title %}AutoCareX{% endblock %}
    </title>
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% include "partials/navbar.html" %}
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>

</html>
